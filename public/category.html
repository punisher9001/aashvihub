<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Category Products</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1 id="catTitle">Category</h1>
    <div id="products"></div>

    <script>
// Get category id from query string
function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

async function loadProducts(catId) {
    try {
        const res = await fetch(`/api/products?category=${catId}`);
        const data = await res.json();

        const container = document.getElementById('products');
        data.forEach(prod => {
            const div = document.createElement('div');
            div.className = 'product-card';
            div.innerHTML = `
                <h3>${prod.name}</h3>
                <p>${prod.description || ''}</p>
                <p>Price: $${prod.price}</p>
                <button data-id="${prod.id}" data-name="${prod.name}">Add to Wishlist</button>
            `;
            container.appendChild(div);
        });

        // Wishlist click handler
        container.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                const id = e.target.dataset.id;
                const name = e.target.dataset.name;
                addToWishlist({ id, name });
                alert(name + ' added to wishlist!');
            }
        });
    } catch (e) {
        console.error('Failed to load products', e);
    }
}

// Simple localStorage wishlist
function addToWishlist(item) {
    const list = JSON.parse(localStorage.getItem('wishlist') || '[]');
    if (!list.find(i => i.id === item.id)) {
        list.push(item);
        localStorage.setItem('wishlist', JSON.stringify(list));
    }
}

// Set title & load
const catId = getQueryParam('cat');
if (catId) {
    loadProducts(catId);
    // Optional: fetch cat name for heading
    fetch(`/api/categories/${catId}`)
        .then(r => r.json())
        .then(cat => {
            document.getElementById('catTitle').textContent = cat.name;
        });
}
    </script>
</body>
</html>
