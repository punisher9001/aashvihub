<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Products | Aashvi Hub</title>
  <link rel="stylesheet" href="/css/style.css?v=9">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding: 24px 16px; max-width: 1100px; margin: 0 auto; color: #0f172a; }
    .header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
    .header-nav a { text-decoration: none; color: #059669; font-weight: 700; font-size: 15px; }
    .page-title { font-size: 26px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 24px; }
    .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
    .product-name { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .product-desc { font-size: 13px; color: #64748b; margin-bottom: 12px; flex: 1; }
    .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .price-val { font-size: 18px; font-weight: 800; color: #059669; }
    .price-mrp { font-size: 13px; color: #94a3b8; text-decoration: line-through; }
    .btn-group { display: flex; gap: 8px; }
    .btn-wish { flex: 1; background: #fff1f2; border: 1px solid #fecdd3; color: #e11d48; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn-cart { flex: 1; background: #059669; border: none; color: white; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header-nav">
    <a href="/explore.html">← All Categories</a>
    <a href="/" style="font-weight:800; color:#0f172a;">Aashvi Hub Store 🛍️</a>
    <a href="/wishlist.html">❤️ Wishlist</a>
  </div>

  <h1 id="catTitle" class="page-title">Category Products</h1>
  <p id="catCount" style="color:#64748b; font-size:14px;">Loading products...</p>

  <div id="products" class="prod-grid"></div>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadCategory() {
      const catId = getQueryParam('cat') || 1;
      const titleEl = document.getElementById('catTitle');
      const countEl = document.getElementById('catCount');
      const grid = document.getElementById('products');

      try {
        const catRes = await fetch(`/api/categories/${catId}`).catch(() => null);
        if (catRes && catRes.ok) {
          const cat = await catRes.json();
          if (cat && cat.name) titleEl.textContent = cat.name;
        }

        const res = await fetch(`/api/products?cat=${catId}`);
        const products = await res.json();

        countEl.textContent = `${products.length} products available`;

        if (!products || products.length === 0) {
          grid.innerHTML = '<p style="color:#64748b;">No products found in this category.</p>';
          return;
        }

        grid.innerHTML = products.map(p => `
          <div class="product-card">
            <img src="${p.image || 'https://via.placeholder.com/200'}" class="product-img" alt="${p.name}">
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.description || ''}</div>
            <div class="price-row">
              <span class="price-val">₹${p.price}</span>
              ${p.mrp > p.price ? `<span class="price-mrp">₹${p.mrp}</span>` : ''}
            </div>
            <div class="btn-group">
              <button class="btn-wish" onclick="addToWishlist(${p.id}, '${escapeQuote(p.name)}', ${p.price}, '${escapeQuote(p.image)}')">❤️ Wishlist</button>
              <button class="btn-cart" onclick="addToCart(${p.id})">+ Add to Cart</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading products:', err);
        grid.innerHTML = '<p style="color:#ef4444;">Failed to load products.</p>';
      }
    }

    function escapeQuote(str) {
      return String(str || '').replace(/'/g, "\\'");
    }

    function addToWishlist(id, name, price, image) {
      let list = JSON.parse(localStorage.getItem('aashvi_wishlist') || '[]');
      if (!list.find(i => i.id === id)) {
        list.push({ id, name, price, image });
        localStorage.setItem('aashvi_wishlist', JSON.stringify(list));
        alert('Added to Wishlist ❤️');
      } else {
        alert('Already in Wishlist!');
      }
    }

    function addToCart(id) {
      let cart = {};
      try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch { cart = {}; }
      if (!cart[id]) cart[id] = { id, qty: 1 };
      else cart[id].qty++;
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Product added to Cart! 🛍️');
    }

    loadCategory();
  </script>
</body>
</html>
